[package]
name = "farfs"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[features]
default = ["path-cache"]
path-cache = ["dep:quick_cache"]
case-insensitive = ["dep:icu_casemap"]

[dependencies]
bitfield = "0.19.5"
bytemuck = { version = "1.25.2", features = ["derive"] }
varint-rs = { version = "2.2.1", default-features = false, features = ["std"] }
quick_cache = { version = "0.7", optional = true }
icu_casemap = { version = "2.3.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"